[project]
name = "metro-breakdown"
version = "0.1.0"
requires-python = ">=3.11"   # Streamlit 1.67 (the app) needs 3.11+

[tool.pytest.ini_options]
pythonpath = ["src", "."]   # lets tests write "from metro.graph import ..." and "from app import ..." without installing anything
testpaths = ["tests"]
